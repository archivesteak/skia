name: Build Skia Prebuilts For Skiko

on:
  push:
    branches:
      - skiko
      - skiko-m*
  pull_request:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone version for manual runs (integer, for example: 146)'
        required: true
        type: number
      should_release:
        description: 'Run release related steps?'
        required: true
        default: false
        type: boolean
      release_approval:
        description: 'Type PUBLISH_PUBLIC_SKIA_RELEASE to approve durable public binaries'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_approved: ${{ steps.mode.outputs.release_approved }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: milestone
        shell: bash
        env:
          INPUT_MILESTONE: ${{ github.event.inputs.milestone || '' }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == skiko-m* ]]; then
            echo "value=${GITHUB_REF_NAME#skiko-}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "value=m${INPUT_MILESTONE}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi
      - id: mode
        shell: bash
        env:
          INPUT_SHOULD_RELEASE: ${{ inputs.should_release || false }}
          INPUT_RELEASE_APPROVAL: ${{ inputs.release_approval || '' }}
        run: |
          if [[ "$INPUT_SHOULD_RELEASE" == "true" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "Public release requires a manual workflow dispatch." >&2
              exit 1
            fi
            if [[ "$INPUT_RELEASE_APPROVAL" != "PUBLISH_PUBLIC_SKIA_RELEASE" ]]; then
              echo "Public release approval phrase is missing or incorrect." >&2
              exit 1
            fi
            echo "release_approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_approved=false" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        shell: bash
        run: |
          SHA="$(git rev-parse --short=10 "$GITHUB_SHA")"
          echo "value=${{ steps.milestone.outputs.value }}-${SHA}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: ${{ fromJson('{"macos":"macos-15","ios":"macos-15","iosSim":"macos-15","tvos":"macos-15","tvosSim":"macos-15"}')[matrix.target] }}
    strategy:
      fail-fast: false
      matrix:
        target: ["macos", "ios", "iosSim", "tvos", "tvosSim"]
        machine: ["x64", "arm64"]
        build_type: [Release, Debug]
        exclude:
          - target: tvos
            machine: x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print Xcode version
        run: xcodebuild -version
      - run: python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --target ${{ matrix.target }} --machine ${{ matrix.machine }} --gpu-as-extension --enable-graphite ${{ matrix.target == 'macos' && '--enable-graphite-dawn' || '' }}
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target ${{ matrix.target }} --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-${{ matrix.target }}-${{ matrix.build_type }}-${{ matrix.machine }}.zip
          path: '*.zip'
          retention-days: 5

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux.sh
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --gpu-as-extension --enable-graphite
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-linux-${{ matrix.build_type }}-x64.zip
          path: '*.zip'
          retention-days: 5

  linux-wasm:
    needs: prepare
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux_wasm.sh
      - run: python3 tools/skia_release/build.py --skia-dir . --target wasm --machine wasm --build-type ${{ matrix.build_type }} --gpu-as-extension --enable-graphite-dawn
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target wasm --machine wasm --build-type ${{ matrix.build_type }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-wasm-${{ matrix.build_type }}-wasm.zip
          path: '*.zip'
          retention-days: 5

  linux-android:
    needs: prepare
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        machine: ["x64", "arm64"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux.sh
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
      - run: python3 tools/skia_release/build.py --skia-dir . --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --ndk ${{ steps.setup-ndk.outputs.ndk-path }} --gpu-as-extension --enable-graphite
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-android-${{ matrix.build_type }}-${{ matrix.machine }}.zip
          path: '*.zip'
          retention-days: 5

  linux-arm64:
    needs: prepare
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: addnab/docker-run-action@v3
        name: Assemble
        with:
          image: arm64v8/ubuntu:20.04
          options: -v ${{ github.workspace }}:/workspace -e BUILD_TYPE=${{ matrix.build_type }} -e BUILD_VERSION=${{ needs.prepare.outputs.version }} -e SKIA_BUILD_DIR=/workspace
          shell: /bin/bash
          run: |
            set -euo pipefail
            cd /workspace
            /bin/bash tools/skia_release/prepare_linux_arm.sh
            python3 tools/skia_release/build.py --skia-dir "${SKIA_BUILD_DIR}" --build-type "${BUILD_TYPE}" --target linux --machine arm64 --gpu-as-extension --enable-graphite
            python3 tools/skia_release/archive.py --skia-dir "${SKIA_BUILD_DIR}" --version "${BUILD_VERSION}" --build-type "${BUILD_TYPE}" --target linux --machine arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-linux-${{ matrix.build_type }}-arm64.zip
          path: '*.zip'
          retention-days: 5

  windows:
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        machine: ["x64", "arm64"]
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: microsoft/setup-msbuild@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: bash
        run: python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }} --gpu-as-extension --enable-graphite-dawn
      - shell: bash
        run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-windows-${{ matrix.build_type }}-${{ matrix.machine }}.zip
          path: '*.zip'
          retention-days: 5

  release:
    needs: [prepare, macos, linux, linux-wasm, linux-android, linux-arm64, windows]
    if: ${{ needs.prepare.outputs.release_approved == 'true' && success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Skia-${{ needs.prepare.outputs.version }}-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish explicitly approved GitHub Release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIA_PUBLIC_RELEASE_APPROVAL: ${{ inputs.release_approval || '' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/skia_release/release_artifacts.py \
            --artifact-dir release-artifacts \
            --version "$VERSION"
